<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>みすず家計簿</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>

:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--navy:#1f3864;--gold:#f2c14e;--cream:#faf6ef;--ink:#22304a;--sub:#7a8699;--line:#f1ecdf;--plus:#2e8b6e;--minus:#d1603d;--nav:60px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation;background:#efe9dd;color:var(--ink);font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",sans-serif;font-size:14px;line-height:1.5}
.phone{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--cream);box-shadow:0 0 40px rgba(31,56,100,.25);padding-bottom:calc(var(--nav) + 8px + var(--sab));position:relative}
.phone.wbar{padding-bottom:calc(var(--nav) + 68px + var(--sab))}
.header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#131f3a 0%,#1f3864 55%,#33598c 100%);color:#fff;height:calc(50px + var(--sat));padding:var(--sat) 14px 0;border-radius:0 0 18px 18px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(19,31,58,.25)}
.header::before{content:"";position:absolute;inset:0;opacity:.8;pointer-events:none;background-image:
radial-gradient(1.5px 1.5px at 20px 12px,#ffe9a8 60%,transparent 61%),radial-gradient(1.2px 1.2px at 130px 36px,#fff 60%,transparent 61%),
radial-gradient(1.5px 1.5px at 210px 10px,#ffe9a8 60%,transparent 61%),radial-gradient(1.2px 1.2px at 300px 40px,#fff 60%,transparent 61%)}
.app-name{position:relative;font-size:16px;font-weight:700;letter-spacing:.04em}
.sync{font-size:10.5px;font-weight:400;color:var(--gold);margin-left:8px;letter-spacing:0}
.mnav{position:relative;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.mnav button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);color:#fff;font-size:13px}
.misuzu{margin:8px 12px 0;display:flex;gap:8px;align-items:center}
.misuzu img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#fff;flex:none}
.bubble{flex:1;min-width:0;background:#fff;border-radius:14px;padding:7px 11px;box-shadow:0 3px 10px rgba(31,56,100,.1);position:relative;font-size:12.5px;line-height:1.5;cursor:pointer}
.bubble::before{content:"";position:absolute;left:-6px;top:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bubble .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bubble.open .t{display:block;-webkit-line-clamp:unset}
main{padding:8px 12px 0;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 3px 10px rgba(31,56,100,.08)}
.card h2{font-size:14px;color:var(--navy);font-weight:700}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ch a{font-size:12px;color:var(--navy);padding:4px 0 4px 10px}
.funds{background:linear-gradient(135deg,#1f3864,#2c4f7c);color:#fff;padding:12px 14px}
.frow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.funds .label{font-size:12px;opacity:.85}
.funds .amount{font-size:28px;font-weight:800;line-height:1.15;word-break:break-all}
.funds .amount.neg{color:#ffb4a0}
.pill{display:inline-block;background:var(--gold);color:#3a2c00;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.plain{background:rgba(255,255,255,.18);color:#fff;font-weight:500}
.bar-wrap{margin-top:8px}
.bar-label{font-size:11px;opacity:.85;display:flex;justify-content:space-between}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:3px}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#f2c14e,#ffd97a)}
.trio2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2);text-align:center}
.trio2 .k{font-size:11px;opacity:.8}.trio2 .v{font-size:15px;font-weight:800;word-break:break-all}
.trio2 .p{color:#8fe0c0}.trio2 .m{color:#ffb4a0}
.plus{color:var(--plus)}.minus{color:var(--minus)}
.side{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;flex-wrap:wrap}
.side b{font-weight:700}
.alert{border:1px solid var(--minus);color:var(--minus);border-radius:10px;padding:5px 9px;font-size:11.5px;margin-top:6px}
.brow{display:grid;grid-template-columns:92px 1fr 92px;gap:8px;align-items:center;padding:5px 0;font-size:12.5px}
.brow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bt{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.brow .bt.over{color:var(--minus);font-weight:700}
.budget-bar{height:7px;border-radius:99px;background:#f0ead9;overflow:hidden}
.budget-bar>div{height:100%;border-radius:99px}
.ok{background:linear-gradient(90deg,#7fb069,#a7c957)}
.warn{background:linear-gradient(90deg,#f2c14e,#f08c3c)}
.over{background:linear-gradient(90deg,#f08c3c,#d1603d)}
.none{background:#f0ead9}
.tx{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0;padding-bottom:0}
.chip{font-size:10.5px;font-weight:700;border-radius:7px;padding:3px 7px;white-space:nowrap;background:#eef2fa;color:var(--navy);max-width:78px;overflow:hidden;text-overflow:ellipsis}
.tx .mid{flex:1;min-width:0}.tx .mid .t{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .mid .d{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .right{text-align:right}.tx .amt{font-size:13.5px;font-weight:700;white-space:nowrap}
.del{background:none;border:0;color:var(--sub);font-size:11px;text-decoration:underline;padding:3px 0 1px}
.del.sure{color:var(--minus);font-weight:700}
.sub{color:var(--sub);font-size:12px}
label{display:block;font-size:11px;color:var(--sub);margin:8px 0 3px}
input[type=text],input[type=password],input[type=date],select{width:100%;min-width:0;padding:9px 10px;border:1px solid #e6dfcc;border-radius:11px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input.amt-in{font-size:28px;font-weight:800;text-align:right;color:var(--navy);padding:6px 10px}
.lrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}.lrow label{margin:0}
.seg{display:flex;border:1px solid var(--navy);border-radius:11px;overflow:hidden}
.seg button{flex:1;padding:8px 0;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:500}
.seg button.on{background:var(--navy);color:#fff}
.seg.sm button{padding:5px 0;font-size:12.5px}
.inl{display:flex;align-items:center;gap:10px;margin-top:8px}.inl label{margin:0;flex:none}.inl .seg{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.chips button{padding:5px 0 4px;border:1px solid #e6dfcc;background:#fff;border-radius:10px;font:inherit;font-size:10px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button span{display:block;font-size:16px;line-height:1.25}
.chips button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.link{display:inline-block;font-size:12px;color:var(--navy);margin-top:8px;text-decoration:underline}
.btn{width:100%;padding:12px;border:0;border-radius:13px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:15px}
.btn.gold{background:linear-gradient(135deg,#f2c14e,#e8a020);color:#3a2c00}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy);font-size:13.5px;padding:9px}
.btn.s{width:auto;padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.5}
.actbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--sab));width:100%;max-width:430px;padding:8px 12px;background:linear-gradient(to top,var(--cream) 78%,rgba(250,246,239,0));z-index:6;display:flex;gap:8px}
.actbar .btn.ghost{flex:0 0 38%}
.bin{width:100%!important;text-align:right;padding:7px 9px!important}
.brow2{display:grid;grid-template-columns:88px 1fr 96px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.brow2:last-child{border-bottom:0}
.brow2 .bn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow2 .st{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap}
.brow2 .st.over{color:var(--minus);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{color:var(--sub);text-align:center;padding:8px 0;font-size:12.5px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);background:#fff;border-top:1px solid #eee5d2;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -3px 12px rgba(31,56,100,.08);z-index:7}
.nav .item{text-align:center;font-size:10.5px;color:#9aa3b2;width:64px;height:100%;border:0;background:none;font-family:inherit}
.nav .item .ic{font-size:19px;display:block;line-height:1.2;margin-bottom:1px}
.nav .item.on{color:var(--navy);font-weight:700}
.nav .fab{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f2c14e,#e8a020);color:#fff;font-size:26px;line-height:42px;text-align:center;box-shadow:0 4px 12px rgba(232,160,32,.45);border:0;font-family:inherit}
.nav .fab.on{box-shadow:0 0 0 3px rgba(31,56,100,.25),0 4px 12px rgba(232,160,32,.45)}
.sk{background:linear-gradient(90deg,#efe9dd 25%,#f7f2e8 50%,#efe9dd 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.sk.d{background:linear-gradient(90deg,rgba(255,255,255,.12) 25%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.12) 75%);background-size:200% 100%}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 12px + var(--sab));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:9;max-width:92%;display:flex;gap:12px;align-items:center;white-space:nowrap}
.toast.hi{bottom:calc(var(--nav) + 76px + var(--sab))}
.toast.err{background:var(--minus)}
.toast button{background:none;border:0;color:var(--gold);font:inherit;font-weight:700;text-decoration:underline;padding:0}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
(function () {
  'use strict';
  var AVATAR = 'avatar.webp';
  var CFG = window.KAKEIBO || {};
  var ICON = { C01: '🍚', C02: '🧴', C03: '🚃', C04: '📱', C05: '🏠', C06: '💡', C07: '🏥', C08: '🛡️', C09: '🎮', C10: '📚', C11: '📦' };
  var S = { auth: 'checking', authErr: '', authId: '', canSetup: false, pwOpen: false, tab: 'home', month: null, data: null, loading: true, error: '', busy: false, toast: null,
    confirmDel: null, fresh: false, misuzuOpen: false, memoOpen: false, toastTok: 0, budgetEdit: {}, accForm: null, imp: null, setEdit: { minLife: null, safe: null },
    form: { type: '支出', kubun: '家計', acc: '', toAcc: '', cat: '', date: '', amount: '', payee: '', memo: '' } };
  var NAV = [['home', '🏠', 'ホーム'], ['budget', '📊', '予算'], ['input', '＋', ''], ['tx', '📝', '取引'], ['acc', '🏦', '口座']];

  // ───── 通信（GAS の doPost へ。text/plain で送ると CORS のプリフライトが起きない） ─────
  function rawPost(obj) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 60000) : null;
    return fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(obj), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (timer) clearTimeout(timer); if (!r.ok) throw new Error('通信エラー（' + r.status + '）'); return r.json(); })
      .catch(function (e) { if (timer) clearTimeout(timer); throw (e && e.name === 'AbortError') ? new Error('通信がタイムアウトしました') : e; });
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return rawPost({ action: 'call', token: store('kk_token'), fn: fn, args: args }).then(function (r) {
      if (r.ok) return r.result;
      if (r.code === 'AUTH') { sessionOut('ログインの有効期限が切れました。もう一度ログインしてください'); throw new Error('認証が必要です'); }
      throw new Error(r.error || 'エラーが発生しました');
    });
  }
  function clearLocal() { try { localStorage.removeItem('kk_token'); localStorage.removeItem('kk_cache'); } catch (e) {} }
  function sessionOut(msg) { clearLocal(); S.data = null; S.imp = null; S.auth = 'login'; S.authErr = msg || ''; S.busy = false; draw(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function yen(n) { return (n < 0 ? '−' : '') + '¥' + Math.abs(n).toLocaleString('ja-JP'); }
  function errText(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function toast(msg, err, undoId) {
    var tok = ++S.toastTok; S.toast = { msg: msg, err: !!err, undo: undoId || '' }; draw();
    setTimeout(function () { if (S.toastTok === tok) { S.toast = null; draw(); } }, undoId ? 4500 : 2400);
  }
  function monthLabel(m) { return m.slice(0, 4) + '年' + (+m.slice(5, 7)) + '月'; }
  function shiftMonth(m, d) { var y = +m.slice(0, 4), n = +m.slice(5, 7) + d; while (n < 1) { n += 12; y--; } while (n > 12) { n -= 12; y++; } return y + '-' + (n < 10 ? '0' : '') + n; }
  function accName(id) { var a = S.data.accounts.filter(function (x) { return x.id === id; })[0]; return a ? a.name : id; }
  function catName(id) { var c = S.data.categories.filter(function (x) { return x.id === id; })[0]; return c ? c.name : ''; }
  function icon(id) { return ICON[id] || '🔹'; }

  function cacheGet(m) { var c = store('kk_cache') || {}; return c[m] || null; }
  function cachePut(m, d) {
    var c = store('kk_cache') || {}; c[m] = { d: d, at: Date.now() };
    Object.keys(c).sort().slice(0, -6).forEach(function (k) { delete c[k]; });   // 直近6カ月分だけ保持
    store('kk_cache', c);
  }
  function thisMonth() { var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2); }
  function applyData(d) {
    S.data = d; S.month = d.month;
    var last = store('kk_last') || {}, f = S.form;
    if (!f.date) f.date = d.today;
    var active = d.accounts.filter(function (a) { return a.active; });
    if (!active.some(function (a) { return a.id === f.acc; })) f.acc = (active.some(function (a) { return a.id === last.acc; }) ? last.acc : (active[0] || {}).id) || '';
    if (!f.cat) f.cat = d.categories.some(function (c) { return c.id === last.cat; }) ? last.cat : '';
  }
  function load() {
    var m = S.month || thisMonth(), c = cacheGet(m);
    S.fresh = false;
    if (c && (!S.data || S.data.month !== m)) { applyData(c.d); S.loading = false; S.error = ''; }   // 前回の表示を先に出す
    else S.loading = !S.data;
    draw();
    return call('apiBootstrap', S.month).then(function (d) {
      applyData(d); cachePut(d.month, d); S.loading = false; S.error = ''; S.fresh = true; draw();
    }).catch(function (e) {
      if (S.auth !== 'in') return;
      S.loading = false;
      if (S.data) toast('最新の取得に失敗しました（古い表示です）：' + errText(e), true);
      else S.error = errText(e);
      draw();
    });
  }

  // ───── 部品 ─────
  function txRow(t, withDel) {
    var title = t.type === '振替' ? esc(accName(t.acc)) + ' → ' + esc(accName(t.toAcc)) : esc(t.payee || catName(t.cat) || t.type);
    var chipTxt = t.type === '振替' ? '振替' : (t.type === '収入' ? (t.kubun === '副収入' ? '副収入' : '収入') : esc(catName(t.cat) || '支出')) + (t.type === '支出' && t.kubun === '副収入経費' ? '・経費' : '');
    var sign = t.type === '支出' ? '−' : (t.type === '収入' ? '+' : '');
    var cls = t.type === '収入' ? ' plus' : '';
    var sure = S.confirmDel === t.id;
    return '<div class="tx"><span class="chip">' + chipTxt + '</span><div class="mid"><div class="t">' + title + '</div><div class="d">' +
      esc(t.date.slice(5).replace('-', '/')) + ' ・ ' + esc(accName(t.acc)) + (t.memo ? ' ・ ' + esc(t.memo) : '') + '</div></div>' +
      '<div class="right"><div class="amt' + cls + '">' + sign + yen(t.amount).replace('−', '') + '</div>' +
      (withDel ? '<button class="del' + (sure ? ' sure' : '') + '" data-act="del" data-id="' + esc(t.id) + '">' + (sure ? 'もう一度押すと削除' : '削除') + '</button>' : '') + '</div></div>';
  }
  function pctOf(p) { return p.rate === null ? 0 : Math.min(100, Math.round(p.rate * 100)); }
  // ホーム用：1行の予算行（名前｜バー｜超過/残り）
  function budgetRow(p) {
    var txt = p.level === 'over' ? '超過 ' + yen(p.spent - p.budget) : '残り ' + yen(p.budget - p.spent);
    return '<div class="brow"><span class="bn">' + icon(p.catId) + ' ' + esc(p.name) + '</span><div class="budget-bar"><div class="' + p.level + '" style="width:' + pctOf(p) + '%"></div></div>' +
      '<span class="bt' + (p.level === 'over' ? ' over' : '') + '">' + txt + '</span></div>';
  }

  // ───── 画面 ─────
  function viewHome() {
    var d = S.data, s = d.summary, h = '';
    h += '<div class="card funds"><div class="frow"><div><div class="label">手元資金（口座残高の合計）</div><div class="amount' + (d.liquid < 0 ? ' neg' : '') + '">' + yen(d.liquid) + '</div></div>';
    if (d.runwayMonths === null) h += '<a class="pill plain" data-act="tab" data-v="acc">最低ライン未設定 ›</a>';
    else if (d.liquid < 0) h += '<span class="pill plain">残高がマイナスです</span>';
    else h += '<span class="pill">生活費 ' + d.runwayMonths + 'カ月分あります</span>';
    h += '</div>';
    if (d.safeRate !== null) {
      var pct = Math.round(d.safeRate * 100);
      h += '<div class="bar-wrap"><div class="bar-label"><span>安心ライン（' + d.safeMonths + 'カ月分）まで</span><span>' + pct + '%</span></div><div class="bar"><div style="width:' + pct + '%"></div></div></div>';
    }
    h += '<div class="trio2"><div><div class="k">収入</div><div class="v p">' + yen(s.income) + '</div></div><div><div class="k">支出</div><div class="v">' + yen(s.expense) + '</div></div>' +
      '<div><div class="k">収支</div><div class="v' + (s.net < 0 ? ' m' : '') + '">' + yen(s.net) + '</div></div></div></div>';
    if (s.sideIncome || s.sideExpense) {
      var diff = s.sideIncome - s.sideExpense;

  function skeleton() {

    var rows = function (n) { var o = ''; for (var i = 0; i < n; i++) o += '<div class="row" style="padding:5px 0"><div class="sk" style="width:90px;height:14px"></div><div class="sk" style="width:60px;height:14px"></div></div>'; return o; };
    if (S.tab === 'home') return '<div class="card funds">' + l('40%', 12, 'd') + l('60%', 30, 'd') + l('100%', 6, 'd') + '<div style="margin-top:12px">' + l('100%', 30, 'd') + '</div></div>' +
      '<div class="card">' + l('30%', 14) + rows(3) + '</div><div class="card">' + l('30%', 14) + rows(3) + '</div>';
    return '<div class="card">' + l('35%', 14) + rows(6) + '</div>';
  }

  // ───── ログイン・初期設定 ─────
  function authMsg(r) {
    var m = { BAD_LOGIN: 'IDまたはパスワードが違います', BAD_SETUP_CODE: '初期設定コードが違います', NOT_CONFIGURED: 'まだ初期設定が済んでいません',
      NO_SETUP_CODE: '初期設定コードが未登録です（GASのスクリプトのプロパティに SETUP_CODE を追加してください）', ALREADY: 'すでに設定済みです。ログインしてください' };
    if (r.code === 'LOCKED') return '失敗が続いたため、約' + (r.minutes || 15) + '分ロックしています。時間をおいてください';
    if (r.code === 'WEAK') return r.error || 'パスワードが弱すぎます';
    return m[r.code] || 'エラーが発生しました（' + (r.code || '不明') + '）';
  }
  function authView() {
    if (!CFG.API_URL) return '<div class="card"><h2 class="minus">設定が未完了です</h2><div class="sub" style="margin-top:6px">config.js の API_URL に、GAS ウェブアプリのURLを設定してください。</div></div>';
    if (S.auth === 'checking') return '<div class="card"><div class="empty">接続中…</div></div>';
    var setup = S.auth === 'setup', h = '<div class="card"><div class="ch"><h2>' + (setup ? '初期設定（ID とパスワードの登録）' : 'ログイン') + '</h2></div><form id="authForm" autocomplete="on">';
    if (setup && !S.canSetup) h += '<div class="alert" style="margin:0 0 6px">初期設定コードが未登録です。GASの「プロジェクトの設定」→「スクリプト プロパティ」に SETUP_CODE を追加してください。</div>';
    if (setup) h += '<label>初期設定コード</label><input id="aCode" name="setupcode" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
    h += '<label>ID（メールアドレス）</label><input id="aId" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(S.authId) + '">';
    h += '<div class="lrow"><label>パスワード' + (setup ? '（12文字以上・16文字以上を推奨）' : '') + '</label><a class="link" style="margin:0" data-act="showpw">表示</a></div>' +
      '<input id="aPw" name="password" type="password" autocomplete="' + (setup ? 'new-password' : 'current-password') + '" autocapitalize="off" autocorrect="off">';
    if (setup) h += '<label>パスワード（確認）</label><input id="aPw2" name="password2" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off">';
    if (S.authErr) h += '<div class="alert" style="margin-top:10px">' + esc(S.authErr) + '</div>';
    h += '<button class="btn gold" type="submit" style="margin-top:12px"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '確認中…' : (setup ? '登録してはじめる' : 'ログイン')) + '</button></form></div>';
    return h;
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }
  function doAuth() {
    if (S.busy) return;
    var setup = S.auth === 'setup', id = val('aId').trim(), pw = val('aPw'), req;
    S.authId = id;
    if (!id || !pw) { S.authErr = 'IDとパスワードを入力してください'; draw(); return; }
    if (setup) {
      if (pw !== val('aPw2')) { S.authErr = '確認用のパスワードが一致しません'; draw(); return; }
      req = { action: 'setup', code: val('aCode').trim(), id: id, password: pw };
    } else req = { action: 'login', id: id, password: pw };
    S.busy = true; S.authErr = ''; draw();
    rawPost(req).then(function (r) {
      S.busy = false;
      if (r.ok) { store('kk_token', r.token); S.auth = 'in'; S.data = null; S.loading = true; S.authErr = ''; draw(); return load(); }
      if (r.code === 'ALREADY') S.auth = 'login';
      S.authErr = authMsg(r); draw();
    }).catch(function (e) { S.busy = false; S.authErr = '通信できません：' + errText(e); draw(); });
  }
  function start() {
    if (!CFG.API_URL) { S.auth = 'login'; draw(); return; }
    if (store('kk_token')) { S.auth = 'in'; load(); return; }
    S.auth = 'checking'; draw();
    rawPost({ action: 'status' }).then(function (r) { S.auth = r.configured ? 'login' : 'setup'; S.canSetup = !!r.canSetup; draw(); })
      .catch(function (e) { S.auth = 'login'; S.authErr = 'サーバーに接続できません：' + errText(e); draw(); });
  }

  function draw() {
    var app = document.getElementById('app'), h = '';
    if (S.auth !== 'in') {
      app.className = 'phone';
      var keep = document.activeElement && document.activeElement.id;
      app.innerHTML = '<div class="header"><div class="app-name"><span style="color:var(--gold)">🌙</span> みすず家計簿</div></div><main>' + authView() + '</main>';
      if (keep) { var el0 = document.getElementById(keep); if (el0 && el0.focus) { try { el0.focus(); } catch (e) {} } }
      return;
    }
    var showMonth = S.data && (S.tab === 'home' || S.tab === 'budget' || S.tab === 'tx');
    var bar = S.data && !S.error && ((S.tab === 'input' && S.data.accounts.some(function (a) { return a.active; })) || S.tab === 'budget');
    h += '<div class="header"><div class="app-name"><span style="color:var(--gold)">🌙</span> みすず家計簿' + (S.data && !S.fresh && !S.error ? '<span class="sync">更新中…</span>' : '') + '</div>' +
      (showMonth ? '<div class="mnav"><button data-act="prev" aria-label="前の月">◀</button><span>' + monthLabel(S.month) + '</span><button data-act="next" aria-label="次の月">▶</button></div>' : '') + '</div>';
    if (S.data && S.tab === 'home' && !S.error) {
      h += '<div class="misuzu"><img src="' + AVATAR + '" alt="美鈴"><div class="bubble' + (S.misuzuOpen ? ' open' : '') + '" data-act="misuzu"><div class="t">' + esc(S.data.comment) + '</div></div></div>';
    }
    h += '<main>';
    if (S.error) h += '<div class="card"><h2 class="minus">読み込みに失敗しました</h2><div style="margin:6px 0 10px">' + esc(S.error) + '</div><button class="btn" data-act="reload">再読み込み</button></div>';
    else if (S.loading && !S.data) h += skeleton();
    else if (S.data) h += S.tab === 'home' ? viewHome() : S.tab === 'tx' ? viewTx() : S.tab === 'input' ? viewInput() : S.tab === 'budget' ? viewBudget() : viewAcc();
    h += '</main>';
    if (bar) h += S.tab === 'input' ? barInput() : barBudget();
    h += '<div class="nav">' + NAV.map(function (t) {
      return t[0] === 'input' ? '<button class="fab' + (S.tab === 'input' ? ' on' : '') + '" data-act="tab" data-v="input" aria-label="入力">＋</button>'
        : '<button class="item' + (S.tab === t[0] ? ' on' : '') + '" data-act="tab" data-v="' + t[0] + '"><span class="ic">' + t[1] + '</span>' + t[2] + '</button>';
    }).join('') + '</div>';
    if (S.toast) h += '<div class="toast' + (S.toast.err ? ' err' : '') + (bar ? ' hi' : '') + '"><span>' + esc(S.toast.msg) + '</span>' + (S.toast.undo ? '<button data-act="undo" data-id="' + esc(S.toast.undo) + '">取り消し</button>' : '') + '</div>';
    var keepFocus = document.activeElement && document.activeElement.id, sy = window.scrollY;
    app.className = 'phone' + (bar ? ' wbar' : '');
    app.innerHTML = h;
    if (sy) window.scrollTo(0, sy);
    if (keepFocus) { var el = document.getElementById(keepFocus); if (el && el.focus && el.tagName !== 'SELECT') { try { el.focus(); } catch (e) {} } }
  }

  // ───── 操作 ─────
  function onAct(act, el) {
    var f = S.form, v = el.getAttribute('data-v');
    if (act === 'tab') { S.tab = v; S.confirmDel = null; draw(); window.scrollTo(0, 0); }
    else if (act === 'prev' || act === 'next') { S.month = shiftMonth(S.month, act === 'prev' ? -1 : 1); S.budgetEdit = {}; load(); }
    else if (act === 'reload') { S.error = ''; load(); }
    else if (act === 'showpw') { ['aPw', 'aPw2'].forEach(function (i) { var e = document.getElementById(i); if (e) e.type = e.type === 'password' ? 'text' : 'password'; }); }
    else if (act === 'logout') sessionOut('');
    else if (act === 'logoutAll') {
      rawPost({ action: 'logoutAll', token: store('kk_token') }).then(function () { sessionOut('すべての端末からログアウトしました'); })
        .catch(function (e) { toast('通信できませんでした：' + errText(e), true); });
    }
    else if (act === 'pwOpen') { S.pwOpen = !S.pwOpen; draw(); }
    else if (act === 'misuzu') { S.misuzuOpen = !S.misuzuOpen; draw(); }
    else if (act === 'memo') { S.memoOpen = true; draw(); var m = document.getElementById('memo'); if (m) m.focus(); }
    else if (act === 'undo') {
      S.toast = null;
      call('apiDeleteTransaction', el.getAttribute('data-id')).then(function () { toast('取り消しました'); return load(); }).catch(function (e) { toast(errText(e), true); });
    }
    else if (act === 'type') { f.type = v; f.kubun = v === '振替' ? '' : '家計'; draw(); }
    else if (act === 'kubun') { f.kubun = v; draw(); }
    else if (act === 'cat') { f.cat = v; draw(); }
    else if (act === 'save') saveTx();
    else if (act === 'del') {
      var id = el.getAttribute('data-id');
      if (S.confirmDel !== id) { S.confirmDel = id; draw(); return; }
      S.confirmDel = null;
      call('apiDeleteTransaction', id).then(function () { toast('削除しました'); return load(); }).catch(function (e) { toast(errText(e), true); });
    }
    else if (act === 'suggest') {
      call('apiSuggestBudgets', S.month).then(function (m) {
        if (!Object.keys(m).length) { toast('提案できる過去データがありません', true); return; }
        Object.keys(m).forEach(function (k) { S.budgetEdit[k] = String(m[k]); });
        draw(); toast('平均を入力しました。調整して保存してください');
      }).catch(function (e) { toast(errText(e), true); });
    }
    else if (act === 'saveBudget') {
      var items = Object.keys(S.budgetEdit).map(function (k) { return { catId: k, amount: S.budgetEdit[k] }; });
      if (!items.length) { toast('変更がありません'); return; }
      S.busy = true; draw();
      call('apiSaveBudgets', S.month, items).then(function () { S.budgetEdit = {}; S.busy = false; toast('予算を保存しました'); return load(); })
        .catch(function (e) { S.busy = false; draw(); toast(errText(e), true); });
    }
    else if (act === 'newAcc') { S.accForm = { id: '', name: '', type: '銀行', initial: '', closing: '', payDay: '', payAcc: '', active: true }; draw(); }
    else if (act === 'editAcc') {
      var a = S.data.accounts.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (a) { S.accForm = { id: a.id, name: a.name, type: a.type, initial: String(a.initial), closing: String(a.closing), payDay: String(a.payDay), payAcc: a.payAcc, active: a.active }; draw(); window.scrollTo(0, document.body.scrollHeight); }
    }
    else if (act === 'cancelAcc') { S.accForm = null; draw(); }
    else if (act === 'saveAcc') saveAcc();
    else if (act === 'impClose') { S.imp = null; draw(); }
    else if (act === 'impRun') impRun();
    else if (act === 'impAdjust') impAdjust();
    else if (act === 'saveSet') {
      var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      call('apiSaveSettings', { minLife: g('minLife'), safeMonths: g('safeMonths') })
        .then(function () { S.setEdit = { minLife: null, safe: null }; toast('保存しました'); return load(); }).catch(function (e) { toast(errText(e), true); });
    }
  }

  function saveTx() {
    var f = S.form;
    if (!f.amount || !(+f.amount > 0)) { toast('金額を入力してください', true); return; }
    if (f.type === '支出' && !f.cat) { toast('費目を選んでください', true); return; }
    if (f.type === '振替' && !f.toAcc) { toast('振替先を選んでください', true); return; }
    S.busy = true; draw();
    call('apiAddTransaction', { type: f.type, amount: f.amount, date: f.date, acc: f.acc, toAcc: f.toAcc, cat: f.type === '支出' ? f.cat : '', kubun: f.kubun, payee: f.payee, memo: f.memo })
      .then(function (r) {
        store('kk_last', { acc: f.acc, cat: f.cat });
        var label = f.type === '支出' ? catName(f.cat) : f.type, amt = f.amount;
        f.amount = ''; f.payee = ''; f.memo = ''; S.busy = false; S.memoOpen = false;
        toast('保存しました：' + label + ' ' + yen(+amt), false, r && r.id);
        return load();
      }).catch(function (e) { S.busy = false; draw(); toast(errText(e), true); });
  }


  // ───── CSV取り込み（defaultbook形式） ─────
  var IMP_DEFAULT = {
    '支|食費': 'e:C01', '支|日用品': 'e:C02', '支|美容': 'e:C02', '支|衣類': 'e:C02', '支|タバコ': 'e:C02', '支|交通費': 'e:C03',
    '支|通信費': 'e:C04', '支|サブスク': 'e:C04', '支|お住まい': 'e:C05', '支|水道・光熱': 'e:C06', '支|医療費': 'e:C07', '支|医療': 'e:C07',
    '支|社会保険料': 'e:C08', '支|レジャー': 'e:C09', '支|パチンコ': 'e:C09', '支|競馬': 'e:C09', '支|競馬(負け)': 'e:C09', '支|デート': 'e:C09',
    '支|交際費': 'e:C09', '支|ゲーム': 'e:C09', '支|マンガ': 'e:C09', '支|銭湯(サウナ)': 'e:C09', '支|書籍': 'e:C10', '支|奨学金': 'e:C10',
    '支|税金': 'e:C11', '支|睡眠': 'e:C11', '支|宿泊': 'e:C11', '支|配送': 'e:C11', '支|振替手数料': 'e:C11',
    '支|借入金返済': 'skip', '支|カード支払い': 'skip', '支|会議費': 'skip', '支|同友会会費': 'skip', '支|税理士費用': 'skip', '支|ITサービス': 'skip', '支|仕事用品': 'skip',
    '収|副業': 'i:副収入', '収|売上': 'i:副収入', '収|給与': 'i:家計', '収|パチ勝ち': 'i:家計', '収|競馬': 'i:家計', '収|返還': 'i:家計'
  };
  var IMP_FLAG = { '交通費': 1, '奨学金': 1, '宿泊': 1, '睡眠': 1, '給与': 1, '売上': 1, '返還': 1, '借入金返済': 1, 'カード支払い': 1, '会議費': 1, '同友会会費': 1, '税理士費用': 1, 'ITサービス': 1, '仕事用品': 1 };
  var IMP_BATCH = 300;

  function parseCsv(text) {
    var rows = [], row = [], f = '', q = false, i = 0, c;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for (; i < text.length; i++) {
      c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  function decodeCsv(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('shift_jis').decode(buf); }
  }
  // 戻り値: { rows:[{key,date,type,amount,cat,memo,created,mk}], invalid, groups:{mk:{kind,cat,n,sum}}, from, to }
  function readImport(text) {
    var tbl = parseCsv(text), head = tbl[0] || [], idx = {};
    head.forEach(function (h, i) { idx[h.trim()] = i; });
    ['日付', 'カテゴリ', '金額', '収支区分', 'UUID'].forEach(function (k) { if (idx[k] === undefined) throw new Error('この形式のCSVではありません（「' + k + '」列がありません）'); });
    var out = { rows: [], invalid: 0, groups: {}, from: '', to: '' };
    for (var r = 1; r < tbl.length; r++) {
      var x = tbl[r];
      if (x.length === 1 && x[0] === '') continue;
      var d = String(x[idx['日付']] || '').trim(), kind = String(x[idx['収支区分']] || '').trim(), amt = Number(String(x[idx['金額']] || '').replace(/,/g, ''));
      var cur = idx['通貨'] === undefined ? 'JPY' : String(x[idx['通貨']] || 'JPY').trim();
      var key = String(x[idx['UUID']] || '').trim();
      if (!/^\d{8}$/.test(d) || (kind !== '支' && kind !== '収') || !(amt > 0) || Math.floor(amt) !== amt || cur !== 'JPY' || !key) { out.invalid++; continue; }
      var date = d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8), cat = String(x[idx['カテゴリ']] || '').trim() || '（未分類）', mk = kind + '|' + cat;
      out.rows.push({ key: key, date: date, type: kind === '支' ? '支出' : '収入', amount: amt, cat: cat, memo: String(x[idx['メモ']] || '').trim().slice(0, 200), created: String(x[idx['最終更新']] || '').trim(), mk: mk });
      var g = out.groups[mk] || (out.groups[mk] = { kind: kind, cat: cat, n: 0, sum: 0 }); g.n++; g.sum += amt;
      if (!out.from || date < out.from) out.from = date;
      if (!out.to || date > out.to) out.to = date;
    }
    return out;
  }
  function impDefault(mk, g) {
    var saved = (store('kk_impmap') || {})[mk];
    if (saved) return saved;
    return IMP_DEFAULT[mk] || (g.kind === '支' ? 'e:C11' : 'i:家計');
  }
  function impSelect(mk, g, cur) {
    var o = '', cats = S.data.categories.filter(function (c) { return c.active; });
    if (g.kind === '支') {
      o += '<optgroup label="家計の支出">' + cats.map(function (c) { return '<option value="e:' + c.id + '"' + (cur === 'e:' + c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</optgroup>';
      o += '<optgroup label="副業の経費">' + cats.map(function (c) { return '<option value="x:' + c.id + '"' + (cur === 'x:' + c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</optgroup>';
    } else {
      o += '<option value="i:家計"' + (cur === 'i:家計' ? ' selected' : '') + '>家計の収入</option><option value="i:副収入"' + (cur === 'i:副収入' ? ' selected' : '') + '>副収入</option>';
    }
    return '<select data-imp="' + esc(mk) + '">' + o + '<option value="skip"' + (cur === 'skip' ? ' selected' : '') + '>取り込まない</option></select>';
  }
  function impStart(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var r = readImport(decodeCsv(rd.result));
        if (!r.rows.length) throw new Error('取り込める行がありませんでした');
        var cash = S.data.accounts.filter(function (a) { return a.active && a.type === '現金'; })[0] || S.data.accounts.filter(function (a) { return a.active; })[0];
        var map = {}; Object.keys(r.groups).forEach(function (mk) { map[mk] = impDefault(mk, r.groups[mk]); });
        S.imp = { data: r, map: map, acc: cash ? cash.id : '', name: file.name, progress: null, done: null };
        draw();
      } catch (e) { toast(errText(e), true); }
    };
    rd.onerror = function () { toast('ファイルを読めませんでした', true); };
    rd.readAsArrayBuffer(file);
  }
  function impPlan() {
    var m = S.imp, rows = [], skip = 0;
    m.data.rows.forEach(function (r) {
      var v = m.map[r.mk];
      if (!v || v === 'skip') { skip++; return; }
      var p = v.split(':'), o = { key: r.key, date: r.date, type: r.type, amount: r.amount, memo: r.memo, created: r.created, cat: '', kubun: '家計' };
      if (p[0] === 'e') o.cat = p[1]; else if (p[0] === 'x') { o.cat = p[1]; o.kubun = '副収入経費'; } else if (p[0] === 'i') o.kubun = p[1];
      rows.push(o);
    });
    return { rows: rows, skip: skip };
  }
  function impRun() {
    var m = S.imp, plan = impPlan(), total = { added: 0, duplicate: 0, invalid: 0, errors: [] }, i = 0;
    if (!m.acc) { toast('取り込み先の口座を選んでください', true); return; }
    if (!plan.rows.length) { toast('取り込む行がありません', true); return; }
    var saved = store('kk_impmap') || {}; Object.keys(m.map).forEach(function (k) { saved[k] = m.map[k]; }); store('kk_impmap', saved);
    S.busy = true; m.progress = { n: 0, of: plan.rows.length }; draw();
    (function next() {
      if (i >= plan.rows.length) {
        S.busy = false; m.progress = null; m.done = { added: total.added, duplicate: total.duplicate, invalid: total.invalid, skip: plan.skip, errors: total.errors };
        toast('取り込み完了：' + total.added + '件を追加'); load(); return;
      }
      call('apiImportTransactions', { source: 'defaultbook', acc: m.acc, rows: plan.rows.slice(i, i + IMP_BATCH) }).then(function (r) {
        total.added += r.added; total.duplicate += r.duplicate; total.invalid += r.invalid; total.errors = total.errors.concat(r.errors || []).slice(0, 5);
        i += IMP_BATCH; m.progress.n = Math.min(i, plan.rows.length); draw(); next();
      }).catch(function (e) {
        S.busy = false; m.progress = null; m.done = { added: total.added, duplicate: total.duplicate, invalid: total.invalid, skip: plan.skip, errors: total.errors, fail: errText(e) };
        draw(); toast('途中で止まりました：' + errText(e) + '（もう一度実行すると続きから取り込めます）', true); if (total.added) load();
      });
    })();
  }
  function impAdjust() {
    var m = S.imp, a = S.data.accounts.filter(function (x) { return x.id === m.acc; })[0], raw = val('impReal').replace(/[^\d-]/g, '');
    if (!a || raw === '' || raw === '-') { toast('実際の残高を入力してください', true); return; }
    var init = a.initial + (Number(raw) - a.balance);
    S.busy = true; draw();
    call('apiSaveAccount', { id: a.id, name: a.name, type: a.type, initial: String(init), closing: a.closing === '' ? '' : String(a.closing), payDay: a.payDay === '' ? '' : String(a.payDay), payAcc: a.payAcc, active: a.active })
      .then(function () { S.busy = false; toast('初期残高を調整し、残高を ' + yen(Number(raw)) + ' に合わせました'); return load(); })
      .catch(function (e) { S.busy = false; draw(); toast(errText(e), true); });
  }
  function viewImport() {
    var m = S.imp, h = '<div class="card"><div class="ch"><h2>CSV取り込み</h2>' + (m ? '<button class="btn ghost s" data-act="impClose">閉じる</button>' : '') + '</div>';
    if (!m) {
      return h + '<div class="sub" style="margin-bottom:8px">以前の家計簿アプリ（defaultbook形式）のCSVを取り込みます。同じ行は二重に入りません。</div>' +
        '<label class="btn ghost" style="display:block;text-align:center;margin:0">CSVファイルを選ぶ<input id="impFile" type="file" accept=".csv,text/csv,text/plain" style="display:none"></label></div>';
    }
    var d = m.data, plan = impPlan(), keys = Object.keys(d.groups).sort(function (a, b) { return d.groups[a].kind === d.groups[b].kind ? d.groups[b].n - d.groups[a].n : (d.groups[a].kind === '支' ? -1 : 1); });
    h += '<div class="sub">' + esc(m.name) + '：' + d.rows.length + '件（' + d.from + ' 〜 ' + d.to + '）' + (d.invalid ? '／読めない行 ' + d.invalid + '件' : '') + '</div>';
    h += '<label>取り込み先の口座</label><select id="impAcc">' + S.data.accounts.filter(function (a) { return a.active; }).map(function (a) { return '<option value="' + esc(a.id) + '"' + (m.acc === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') + '</select>';
    h += '<div class="sub" style="margin:10px 0 4px">カテゴリの振り分け（⚠は会社・立替・借入と混ざっていないか確認してください）</div>';
    keys.forEach(function (mk) {
      var g = d.groups[mk];
      h += '<div class="row" style="padding:5px 0;gap:6px"><div style="flex:1;min-width:0"><div class="t" style="font-size:13px">' + (IMP_FLAG[g.cat] ? '⚠ ' : '') + esc(g.kind === '支' ? '' : '【収入】') + esc(g.cat) + '</div><div class="sub" style="font-size:11px">' + g.n + '件 ・ ' + yen(g.sum) + '</div></div><div style="flex:0 0 46%">' + impSelect(mk, g, m.map[mk]) + '</div></div>';
    });
    h += '<div class="sub" style="margin-top:8px">取り込む ' + plan.rows.length + '件 ／ 取り込まない ' + plan.skip + '件</div>';
    if (m.progress) h += '<div class="sub" style="margin-top:6px">取り込み中… ' + m.progress.n + ' / ' + m.progress.of + '</div>';
    h += '<button class="btn gold" data-act="impRun" style="margin-top:10px"' + (S.busy ? ' disabled' : '') + '>' + (m.done ? 'もう一度実行（重複は入りません）' : 'この内容で取り込む') + '</button>';
    if (m.done) {
      h += '<div class="alert" style="margin-top:10px">追加 ' + m.done.added + '件 ／ 重複 ' + m.done.duplicate + '件 ／ 対象外 ' + m.done.skip + '件 ／ エラー ' + m.done.invalid + '件' + (m.done.fail ? '<br>' + esc(m.done.fail) : '') + (m.done.errors.length ? '<br>' + m.done.errors.map(esc).join('<br>') : '') + '</div>';
      var a = S.data.accounts.filter(function (x) { return x.id === m.acc; })[0];
      if (a) h += '<label>実際の残高に合わせる（いまのアプリ上の残高 ' + yen(a.balance) + '）</label><input id="impReal" type="text" inputmode="numeric" placeholder="いま財布にある金額（円）">' +
        '<div class="sub" style="margin:4px 0">入れると「初期残高」を自動で調整します。取引は増えません。</div><button class="btn ghost" data-act="impAdjust"' + (S.busy ? ' disabled' : '') + '>残高を合わせる</button>';
    }
    return h + '</div>';
  }

  function saveAcc() {
    var f = S.accForm, g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    var p = { id: f.id, name: g('aName'), type: g('aType'), initial: g('aInit'), closing: g('aClose'), payDay: g('aPay'), payAcc: g('aPayAcc'), active: f.id ? g('aActive') !== '無効' : true };
    S.busy = true; draw();
    call('apiSaveAccount', p).then(function () { S.accForm = null; S.busy = false; toast('口座を保存しました'); return load(); })
      .catch(function (e) { S.busy = false; draw(); toast(errText(e), true); });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (el) onAct(el.getAttribute('data-act'), el);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target, id = t.id, f = S.form;
    if (id === 'amt') { t.value = t.value.replace(/[^\d]/g, ''); f.amount = t.value; var p = document.getElementById('amtPrev'); if (p) p.textContent = f.amount ? yen(+f.amount) : ''; }
    else if (id === 'payee') f.payee = t.value;
    else if (id === 'memo') f.memo = t.value;
    else if (id === 'date') f.date = t.value;
    else if (id === 'minLife') S.setEdit.minLife = t.value;
    else if (id === 'safeMonths') S.setEdit.safe = t.value;
    else if (t.getAttribute && t.getAttribute('data-cat')) { t.value = t.value.replace(/[^\d]/g, ''); S.budgetEdit[t.getAttribute('data-cat')] = t.value; }
  });
  document.addEventListener('change', function (ev) {
    var id = ev.target.id, f = S.form;
    if (id === 'acc') f.acc = ev.target.value;
    else if (id === 'toAcc') f.toAcc = ev.target.value;
    else if (id === 'impFile') { var fl = ev.target.files && ev.target.files[0]; if (fl) impStart(fl); }
    else if (id === 'impAcc' && S.imp) S.imp.acc = ev.target.value;
    else if (ev.target.getAttribute && ev.target.getAttribute('data-imp') && S.imp) { S.imp.map[ev.target.getAttribute('data-imp')] = ev.target.value; draw(); }
    else if (id === 'aType' && S.accForm) {
      var g = function (i) { var e = document.getElementById(i); return e ? e.value : null; };
      if (g('aName') !== null) S.accForm.name = g('aName');
      if (g('aInit') !== null) S.accForm.initial = g('aInit');
      S.accForm.type = ev.target.value; draw();
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'authForm') doAuth();
    else if (ev.target.id === 'pwForm') changePw();
  });
  function changePw() {
    var o = val('pwOld'), n1 = val('pwNew'), n2 = val('pwNew2');
    if (!o || !n1) { toast('パスワードを入力してください', true); return; }
    if (n1 !== n2) { toast('確認用のパスワードが一致しません', true); return; }
    rawPost({ action: 'changePassword', token: store('kk_token'), oldPassword: o, newPassword: n1 }).then(function (r) {
      if (r.ok) { store('kk_token', r.token); S.pwOpen = false; draw(); toast('パスワードを変更しました'); return; }
      if (r.code === 'AUTH') { sessionOut('ログインの有効期限が切れました。もう一度ログインしてください'); return; }
      toast(authMsg(r), true);
    }).catch(function (e) { toast('通信できませんでした：' + errText(e), true); });
  }

  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  window.addEventListener('load', function () { start(); });
})();
</script>
